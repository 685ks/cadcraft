[package]
name = "cadcraft-fonts"
description = "CADCraft text: the built-in single-stroke drafting font and TEXT/MTEXT layout"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }

[build-dependencies]
# Embeds the fonts of the optional craft-fonts checkout (CRAFT_FONTS_DIR); nothing without it.
craft-fonts-build = { git = "https://github.com/685ks/craft-fonts", rev = "f28afbb766ccddc9cfd136b8cf0b451a24149e1b" }
